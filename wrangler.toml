name = "head-start"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

# Preview deployment: the same code built from `main` with HEAD_START_PREVIEW=true
# and CLOUDFLARE_ENV=preview, deployed to its own Worker, see docs/preview-mode.md
[env.preview]
name = "head-start-preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"

[env.preview.observability]
enabled = true
