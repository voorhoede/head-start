name: Deploy

on:
  push:
    branches:
      - bunny-full-edge
  workflow_dispatch:

permissions:
  contents: read
  deployments: write # records each deploy in the repository's Environments

# One deploy at a time; a running deploy is never cancelled, so its upload and publish finish together.
concurrency:
  group: deploy-full-edge
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Bunny
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATOCMS_READONLY_API_TOKEN: ${{ secrets.DATOCMS_READONLY_API_TOKEN }}
      DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
      HEAD_START_PREVIEW_SECRET: ${{ secrets.HEAD_START_PREVIEW_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      # Optional: with Deno on the PATH the deploy action also measures the script's startup time.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Bunny
        uses: voorhoede/bunny-edge-deploy@b6160a5ecc85a6bd9e5c99821268f86bc8958bb8 # feat/middleware-deploy
        with:
          bunny-api-key: ${{ secrets.BUNNY_API_KEY }}
          name: head-start-full-edge
          github-environment: full-edge
          storage-tier: edge
          replication-regions: UK, ES, CZ, SE, LA, MI, NY, WA, HK, SG, SYD, JP, BR, JH
          pricing-regions: EU, US, ASIA, SA, AF
          secrets: |
            DATOCMS_READONLY_API_TOKEN=${{ secrets.DATOCMS_READONLY_API_TOKEN }}
            HEAD_START_PREVIEW_SECRET=${{ secrets.HEAD_START_PREVIEW_SECRET }}
