name: Deploy

on:
  push:
    branches:
      - feat/bunny
  workflow_dispatch:
  # Sent by a DatoCMS build trigger when editors publish; see docs/getting-started.md.
  repository_dispatch:
    types: [datocms-publish]

permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled, so its upload and publish finish together.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Bunny
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATOCMS_READONLY_API_TOKEN: ${{ secrets.DATOCMS_READONLY_API_TOKEN }}
      DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
      HEAD_START_PREVIEW_SECRET: ${{ secrets.HEAD_START_PREVIEW_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      # Optional: with Deno on the PATH the deploy action also measures the script's startup time.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Bunny
        uses: voorhoede/bunny-edge-deploy@120fbb68be0d2a8596c7a5360c459b87ad56f3bf # feat/build-manifest-deploy
        with:
          bunny-api-key: ${{ secrets.BUNNY_API_KEY }}
          # `/` redirects to a locale, and the smoke test expects a 2xx.
          smoke-route: /en/
          secrets: |
            DATOCMS_READONLY_API_TOKEN=${{ secrets.DATOCMS_READONLY_API_TOKEN }}
            HEAD_START_PREVIEW_SECRET=${{ secrets.HEAD_START_PREVIEW_SECRET }}

      - name: Notify DatoCMS
        if: always()
        run: npm run ci:notify-datocms -- ${{ job.status }}
