#import '~/layouts/AppMenu/AppMenu.fragment.graphql'
#import '~/blocks/ActionBlock/ExternalLink.fragment.graphql'

query App($locale: SiteLocale!) {
  app(locale: $locale) {
    ...AppMenu
    allowAiBots
    llmsIntro
    openPageInLlmPrompt
    openPageInLlmOption {
      ...ExternalLink
    }
  }
  site: _site(locale: $locale) {
    noIndex
    favicon {
      url
    }
    faviconMetaTags(variants: [icon, appleTouchIcon, msApplication]) {
      tag
      attributes
    }
    globalSeo {
      siteName
      fallbackSeo {
        description
      }
    }
  }
}
